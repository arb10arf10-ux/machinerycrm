name: Build Windows Desktop Installer

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and package Windows app
        run: npm run desktop:dist
        env:
          VITE_SUPABASE_URL: https://pszqjcjdisotbujlslls.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Machinery-CRM-Windows-Installer
          path: client/release/*.exe
          if-no-files-found: error
          retention-days: 30
